# Hue 4.x - laboratorio Iceberg SII.
# Se monta como z-hue.ini para que gane sobre la config por defecto de la imagen
# (Hue lee los .ini de conf/ en orden alfabetico; la "z" asegura ser el ultimo).

[desktop]
  http_host=0.0.0.0
  http_port=8888
  # Detras de Caddy; el lab no usa TLS en local.
  secure_proxy_ssl_header=false
  django_debug_mode=false
  http_500_debug_mode=false
  # Sin Kerberos: autenticacion simple contra la base interna de Hue.
  #
  # El secreto NO va en el repositorio. 'secret_key_script' ejecuta el comando y
  # toma su salida (desktop/lib/conf.py:720, shell=True, recorta el \n final);
  # 'printenv' lo lee de la variable que docker-compose pasa desde .env.
  # Si la variable falta, printenv sale con 1 y Hue no arranca: falla ruidoso,
  # que es lo que se quiere, en vez de quedar con un secreto vacio.
  secret_key_script=printenv HUE_SECRET_KEY

  # Apps que no aplican a este lab (evita errores ruidosos en la UI).
  app_blacklist=impala,hbase,search,security,oozie,pig,sqoop,spark,zookeeper

  [[database]]
    # PostgreSQL, NO SQLite. Ver docs/adr/ADR-003.
    #
    # Con SQLite el laboratorio fallaba con una sola persona conectada: Hue
    # escribe una fila en su propia base cada vez que abre sesion Thrift contra
    # spark-thrift (hive_server2_lib.py:719, Session.objects.create), y ese
    # INSERT choca con el lock global de escritura del archivo:
    #
    #   sqlite3.OperationalError: database is locked
    #   -> beeswax/api.py _autocomplete se cae
    #   -> el editor muestra "No databases found"
    #
    # Las dos fallas son la misma. Con siete personas a la vez no era viable.
    #
    # Base y usuario DEDICADOS: no se comparte nada con el Hive Metastore, que
    # vive en la base 'metastore' del mismo servidor con otro rol.
    engine=postgresql_psycopg2
    host=postgres
    port=5432
    name=hue
    user=hue_app
    # La clave no va en el repositorio, igual que el secret_key de arriba.
    password_script=printenv HUE_DB_PASSWORD

  [[auth]]
    backend=desktop.auth.backend.AllowFirstUserDjangoBackend

[notebook]
  show_notebooks=true

  [[interpreters]]
    # PLAN B ACTIVO: Hue -> Spark Thrift Server (protocolo HiveServer2, dialecto
    # SparkSQL). Mismos jars Iceberg 1.3.0 y mismo metastore que los Jupyter.
    # Ver README "Problemas conocidos" para por que no quedo el plan A (HS2).
    #
    # OJO CON EL NOMBRE DE LA SECCION. Tiene que ser 'hive', no 'sparksql'.
    # Hue filtra los interpretes por permisos en notebook/conf.py:
    #
    #   check_has_missing_permission():
    #     (interpreter in ('spark','pyspark','r','jar','py','sparksql')
    #      and 'spark' not in user_apps)
    #
    # Como este lab tiene 'spark' en app_blacklist (no hay Livy y el menu
    # sobraria), un interprete llamado 'sparksql' se descarta en silencio: Hue
    # arranca sano, el editor no aparece y el panel Sources queda vacio.
    # Llamandolo 'hive' pasa el filtro, que ademas es honesto: al otro lado hay
    # un servidor que habla el protocolo HiveServer2. El motor sigue siendo
    # Spark, y el nombre que ve el alumno lo fija 'name='.
    [[[hive]]]
      name=SparkSQL (Iceberg)
      interface=hiveserver2

[beeswax]
  # Backend SQL. Valores literales a proposito: la interpolacion de variables de
  # entorno en los .ini de Hue no es fiable entre versiones.
  # PLAN B (activo)  -> spark-thrift : 10000
  # PLAN A (si algun dia funciona) -> hiveserver2 : 10000  (levantar el servicio
  #   'hiveserver2' con la imagen hive-metastore y cambiar solo esta linea)
  hive_server_host=spark-thrift
  hive_server_port=10000
  # SASL ENCENDIDO. El Thrift Server arranca con la autenticacion por defecto
  # de HiveServer2 (NONE), que igual envuelve la conexion en SASL-PLAIN: es lo
  # que hace beeline y por eso el smoke-test conecta sin problemas.
  # Con use_sasl=false, Hue manda thrift crudo y el servidor cierra la conexion
  # sin escribir nada -> "TSocket read 0 bytes (code THRIFTTRANSPORT)".
  use_sasl=true
  auth_username=hue
  thrift_version=7

[hadoop]
  [[hdfs_clusters]]
    [[[default]]]
      fs_defaultfs=hdfs://namenode:8020
      # WebHDFS del NameNode: permite al alumno navegar el warehouse desde Hue.
      webhdfs_url=http://namenode:9870/webhdfs/v1
      security_enabled=false

[metastore]
  # Permite explorar databases/tablas del metastore compartido desde Hue.
  force_hs2_metadata=true
