# Configuracion Spark <-> Iceberg <-> Hive Metastore del laboratorio SII.
#
# El catalogo se configura AQUI, no en el codigo de los notebooks: el alumno
# abre Jupyter y ya tiene Iceberg operativo, igual que en CDP donde la config
# viene del cluster.

# --- Iceberg sobre el catalogo de sesion -------------------------------------
# SparkSessionCatalog envuelve el catalogo Hive nativo: las tablas Iceberg y las
# tablas Hive conviven bajo el mismo namespace, y USE / SHOW TABLES funcionan
# igual que en CDP. (Con SparkCatalog "puro" habria que prefijar todo.)
spark.sql.extensions                                 org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.spark_catalog                      org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type                 hive

# --- Metastore compartido por los 7 alumnos ----------------------------------
spark.hadoop.hive.metastore.uris                     thrift://hive-metastore:9083
spark.sql.catalogImplementation                      hive
spark.sql.warehouse.dir                              hdfs://namenode:8020/warehouse/iceberg
spark.hadoop.hive.metastore.warehouse.dir            hdfs://namenode:8020/warehouse/iceberg

# --- HDFS --------------------------------------------------------------------
spark.hadoop.fs.defaultFS                            hdfs://namenode:8020
# El cliente debe hablar con el DataNode por hostname de red Docker, no por IP.
spark.hadoop.dfs.client.use.datanode.hostname        true

# --- Spark en modo local dentro de cada Jupyter -------------------------------
# Sin YARN ni standalone: complejidad sin valor didactico para este curso.
spark.master                                         local[2]
spark.driver.memory                                  2g
spark.sql.shuffle.partitions                         4

# Barra de progreso APAGADA a proposito (SPEC-008 §2). En una terminal informa;
# dentro de un notebook imprime lineas como
#     [Stage 2:====>   (1 + 1) / 2]
# en medio de la salida de una celda. El publico del curso son operadores y
# analistas: no saben que es un stage y lo leen como que algo salio mal.
spark.ui.showConsoleProgress                         false

# Evita que 7 drivers peleen por el mismo puerto de Spark UI.
spark.ui.port                                        4040
spark.port.maxRetries                                32

# Sin espera de localidad. En un lab de un solo nodo no hay localidad que
# esperar, y con el valor por defecto (3s) los procedimientos de mantenimiento
# de Iceberg —expire_snapshots, remove_orphan_files y el borrado de PURGE— se
# quedan colgados para siempre: la ultima tarea de su trabajo de limpieza
# declara como ubicacion preferida un datanode que aqui no es un ejecutor, y el
# planificador nunca la baja a ANY. Medido: se cuelga indefinidamente con el
# valor por defecto, termina en 2 s con 0.
spark.locality.wait                                  0
