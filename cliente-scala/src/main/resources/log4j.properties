# Traza de reload4j, que es el log4j 1.x que arrastra Hadoop 3.3.6.
#
# Va DENTRO del jar a proposito. En el laboratorio 09 el alumno lo lanza con
# 'java -jar' pelado, desde una celda de su cuaderno, sin banderas. Sin este
# archivo, reload4j avisa tres veces que no encuentra appenders y lo hace justo
# entre el primer titulo y los primeros datos.
log4j.rootLogger=ERROR, consola
log4j.appender.consola=org.apache.log4j.ConsoleAppender
log4j.appender.consola.target=System.err
log4j.appender.consola.layout=org.apache.log4j.PatternLayout
log4j.appender.consola.layout.ConversionPattern=%p %c %m%n
